# ─── BAVIS Data Workstream — local dev services ───────────────────────────────
# Brings up PostgreSQL and MinIO so you can run migrations and seed without
# a full BAVIS stack.
#
# Usage:
#   docker-compose up -d        # start Postgres + MinIO
#   make migrate                # apply schema
#   make seed                   # insert demo data
#   docker-compose down -v      # stop and wipe volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: bavis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bavis_db
      POSTGRES_USER: bavis
      POSTGRES_PASSWORD: bavis_secret
    ports:
      - "5433:5432"
    volumes:
      - bavis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bavis -d bavis_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bavis_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console (web UI)
    volumes:
      - bavis_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bavis_pgdata:
  bavis_minio_data:
