name: BAVIS DevOps & Integration CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-validate:
    name: Validate Docker Compose & Service Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Copy Environment Template
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest requests pyjwt

      - name: Lint Python Codebases
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 ingestion/ ai-engine/ intelligence/ backend-api/ infra/scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-test:
    name: Build Containers & Verify RBAC Security
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Environment Template
        run: cp .env.example .env

      - name: Build Docker Stack
        run: docker compose build

      - name: Start BAVIS Services
        run: docker compose up -d

      - name: Wait for Database & Backend Health
        run: |
          echo "Waiting for services to initialize..."
          sleep 15
          docker compose ps

      - name: Run Security & RBAC Enforcement Suite
        run: |
          python infra/scripts/verify_security_rbac.py http://localhost:8080/api/v1

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v
